<div class="p-4">
  <!-- matTabContent renders a tab only while it is open, so every report reloads fresh. -->
  <mat-tab-group animationDuration="0ms">
    <mat-tab label="Summary">
      <ng-template matTabContent><div class="pt-4"><app-accounts-summary /></div></ng-template>
    </mat-tab>
    <mat-tab label="Cash Book">
      <ng-template matTabContent><div class="pt-4"><app-cash-book /></div></ng-template>
    </mat-tab>
    <mat-tab label="Profit &amp; Loss">
      <ng-template matTabContent><div class="pt-4"><app-profit-loss /></div></ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
