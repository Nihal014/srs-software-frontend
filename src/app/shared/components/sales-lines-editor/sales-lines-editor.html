<div class="bg-white border border-border rounded-md p-4 mb-3 overflow-x-auto">
  <table mat-table [dataSource]="rows()" class="w-full min-w-[900px] rounded-md overflow-hidden">
    <ng-container matColumnDef="slno">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-200 w-16 whitespace-nowrap">Sl No</th>
      <td mat-cell *matCellDef="let row; let i = index" class="w-16">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="product">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-200">Product</th>
      <td mat-cell *matCellDef="let line" [formGroup]="line">
        <mat-form-field appearance="outline" class="dense-field w-56">
          <mat-label>Select product</mat-label>
          <mat-select formControlName="productId" (selectionChange)="onProduct(line)">
            @for (p of products(); track p.id) {
              <mat-option [value]="p.id">{{ p.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="unit">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-200">Unit</th>
      <td mat-cell *matCellDef="let line">{{ unitOf(line) }}</td>
    </ng-container>
    <ng-container matColumnDef="qty">
      <th mat-header-cell *matHeaderCellDef class="text-right bg-gray-200">Qty</th>
      <td mat-cell *matCellDef="let line" class="text-right" [formGroup]="line">
        <mat-form-field appearance="outline" class="dense-field w-24">
          <input matInput type="number" formControlName="qty" aria-label="Quantity" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="rate">
      <th mat-header-cell *matHeaderCellDef class="text-right bg-gray-200">Rate (Rs)</th>
      <td mat-cell *matCellDef="let line" class="text-right" [formGroup]="line">
        <mat-form-field appearance="outline" class="dense-field w-28">
          <input matInput type="number" step="0.01" formControlName="rate" aria-label="Rate" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="tax">
      <th mat-header-cell *matHeaderCellDef class="text-right bg-gray-200">Tax %</th>
      <td mat-cell *matCellDef="let line" class="text-right" [formGroup]="line">
        <mat-form-field appearance="outline" class="dense-field w-20">
          <input matInput type="number" formControlName="taxPercent" aria-label="Tax percent" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="discount">
      <th mat-header-cell *matHeaderCellDef class="text-right bg-gray-200">Discount (Rs)</th>
      <td mat-cell *matCellDef="let line" class="text-right" [formGroup]="line">
        <mat-form-field appearance="outline" class="dense-field w-28">
          <input matInput type="number" step="0.01" formControlName="discount" aria-label="Discount" />
        </mat-form-field>
      </td>
    </ng-container>
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef class="text-right bg-gray-200">Amount (Rs)</th>
      <td mat-cell *matCellDef="let line" class="text-right">{{ amountOf(line) | number: '1.2-2' }}</td>
    </ng-container>
    <ng-container matColumnDef="remove">
      <th mat-header-cell *matHeaderCellDef class="bg-gray-200"></th>
      <td mat-cell *matCellDef="let line; let i = index">
        @if (rows().length > 1) {
          <button mat-button color="warn" type="button" (click)="remove(i)">Remove</button>
        }
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <div class="flex items-center justify-between mt-3">
    <button mat-stroked-button class="bg-white" type="button" (click)="add()">+ Add line</button>
    <div class="text-sm font-semibold">Total: Rs {{ total() | number: '1.2-2' }}</div>
  </div>
</div>
